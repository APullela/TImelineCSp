<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Internet History Timeline Practice</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --error-color: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background-color: var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-dot {
            position: absolute;
            left: -30px;
            top: 15px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: 2px solid var(--card-bg);
        }

        .timeline-card {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .timeline-year {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .table-input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            resize: vertical;
            min-height: 50px;
        }

        .table-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        #score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--success-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Internet History Timeline Practice</h1>
        <div class="subtitle">The years are provided for you. Type out the historical milestone or event that occurred for each year, then click check!</div>

        <div class="timeline" id="timeline-container">
            <!-- Dynamically populated timeline items -->
        </div>

        <div class="controls">
            <button class="action-btn" onclick="gradeTimeline()">Check Answers</button>
            <span id="score-display"></span>
        </div>
    </div>

    <script>
        const timelineData = [
            { year: "1957", keywords: ["sputnik", "catalyst"] },
            { year: "1962", keywords: ["paul baran", "packet switching"] },
            { year: "1969", keywords: ["arpanet", "ucla", "santa barbara", "utah", "stanford"] },
            { year: "1972", keywords: ["tomlinson", "email", "darpa"] },
            { year: "1973", keywords: ["cerf", "kahn", "tcp", "metcalfe", "ethernet"] },
            { year: "1981", keywords: ["nsp", "csnet"] },
            { year: "1983", keywords: ["wisconsin", "dns", "human", "readable"] },
            { year: "1985", keywords: ["nsf", "t1"] },
            { year: "1988", keywords: ["t1", "traffic", "congestion"] },
            { year: "1991", keywords: ["t3", "berners-lee", "html", "http", "www"] },
            { year: "1993", keywords: ["illinois", "gui", "mosaic"] },
            { year: "1994", keywords: ["pizza hut", "first virtual", "commercialization"] }
        ];

        function initTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = '';
            
            timelineData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-card">
                        <div class="timeline-year">${item.year}</div>
                        <textarea class="table-input timeline-input" data-index="${index}" placeholder="Type what happened in ${item.year}..."></textarea>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function gradeTimeline() {
            const inputs = document.querySelectorAll('.timeline-input');
            let correctCount = 0;

            inputs.forEach((input, index) => {
                const val = input.value.trim().toLowerCase();
                const item = timelineData[index];
                
                // Check if at least one key concept keyword matches
                const matched = item.keywords.some(kw => val.includes(kw));

                if (matched && val.length > 3) {
                    correctCount++;
                    input.style.borderColor = 'var(--success-color)';
                } else {
                    input.style.borderColor = 'var(--error-color)';
                }
            });

            const score = Math.round((correctCount / timelineData.length) * 100);
            document.getElementById('score-display').textContent = `Score: ${score}% (${correctCount}/${timelineData.length} correct)`;
        }

        initTimeline();
    </script>
</body>
</html>
